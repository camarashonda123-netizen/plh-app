<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de ingresos · Playa Honda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #eef4f6;
      --sf: #fff;
      --sf2: #f3f8f9;
      --ink: #0d2a33;
      --mut: #5a717b;
      --line: #dbe6ea;
      --deep: #022f3b;
      --teal: #035a70;
      --sea: #0b8fa9;
      --gold: #c9a35f;
      --gold2: #e8c987;
      --ok: #12803f;
      --okbg: #e0f4e8;
      --no: #b42f2f;
      --nobg: #fbe6e4;
      --g1: linear-gradient(135deg, #033c4b, #0b8fa9);
      --sh: 0 2px 4px rgba(3, 60, 75, .05), 0 18px 40px -18px rgba(3, 60, 75, .3);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #061a21;
        --sf: #0d2832;
        --sf2: #123543;
        --ink: #e6f0f3;
        --mut: #8fa8b1;
        --line: #1c424f;
        --okbg: #0f3a24;
        --nobg: #401a1a;
        --ok: #4ade80;
        --no: #f28b8b
      }
    }

    :root[data-theme="dark"] {
      --bg: #061a21;
      --sf: #0d2832;
      --sf2: #123543;
      --ink: #e6f0f3;
      --mut: #8fa8b1;
      --line: #1c424f;
      --okbg: #0f3a24;
      --nobg: #401a1a;
      --ok: #4ade80;
      --no: #f28b8b
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums
    }

    .wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 40px)
    }

    .top {
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 0 #e3ecef, 0 8px 24px -16px rgba(3, 60, 75, .35)
    }

    .top .wrap {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 72px
    }

    .logo {
      height: 46px;
      width: auto;
      display: block
    }

    #nav {
      display: flex;
      gap: 6px;
      flex: 1
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      color: #3d5963;
      font: 700 14px inherit;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, color .15s
    }

    .nav svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .nav:hover {
      background: #eaf3f6
    }

    .nav.on {
      background: var(--g1);
      color: #fff;
      box-shadow: 0 8px 18px -8px rgba(3, 90, 112, .7)
    }

    .clock {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #5a717b;
      font-weight: 600
    }

    .clock input {
      width: auto;
      background: #f1f6f8;
      border: 1px solid #dbe6ea;
      color: #0d2a33;
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 15px inherit;
      font-family: inherit;
      color-scheme: light
    }

    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: radial-gradient(120% 140% at 85% -20%, #0b8fa9 0%, transparent 55%), linear-gradient(135deg, #021f29 0%, #033c4b 55%, #035a70 100%);
      padding: 46px 0 128px
    }

    .sun {
      position: absolute;
      right: 9%;
      top: -70px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #f3dba0 0%, #c9a35f 45%, rgba(201, 163, 95, 0) 70%);
      opacity: .9;
      filter: blur(1px)
    }

    .hero .wrap {
      position: relative
    }

    .date {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .2);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(6px)
    }

    .date::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold2);
      box-shadow: 0 0 0 4px rgba(232, 201, 135, .25)
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(32px, 5.4vw, 54px);
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.05;
      max-width: 16ch
    }

    .hero p {
      margin: 0;
      color: #c3dde4;
      font-size: 17px;
      max-width: 46ch
    }

    .waves {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 96px
    }

    .content {
      position: relative;
      margin-top: -84px;
      padding-bottom: 60px
    }

    h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em
    }

    h3 {
      margin: 28px 0 10px;
      font-size: 15px;
      font-weight: 800
    }

    .mut {
      color: var(--mut);
      font-size: 13px;
      margin: 4px 0 12px
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 26px;
      box-shadow: var(--sh)
    }

    input,
    select,
    textarea {
      font: inherit;
      color: var(--ink);
      background: var(--sf);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      width: 100%;
      transition: border-color .15s, box-shadow .15s
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--sea);
      box-shadow: 0 0 0 4px rgba(11, 143, 169, .2)
    }

    textarea {
      min-height: 96px;
      resize: vertical
    }

    button {
      font: 700 14px inherit;
      font-family: inherit;
      background: var(--g1);
      color: #fff;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      box-shadow: 0 10px 20px -10px rgba(3, 90, 112, .8);
      transition: transform .12s, box-shadow .15s
    }

    button:hover {
      transform: translateY(-1px)
    }

    button:active {
      transform: none
    }

    button.ghost {
      background: var(--sf);
      color: var(--ink);
      border-color: var(--line);
      box-shadow: none
    }

    button.sm {
      padding: 9px 16px;
      font-size: 13px
    }

    :focus-visible {
      outline: 3px solid var(--sea);
      outline-offset: 2px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--sf);
      border-radius: 22px;
      padding: 20px 22px;
      box-shadow: var(--sh);
      border: 1px solid var(--line)
    }

    .stat i {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--g1);
      flex: none
    }

    .stat:nth-child(2) i {
      background: linear-gradient(135deg, #b8893a, #e8c987)
    }

    .stat:nth-child(3) i {
      background: linear-gradient(135deg, #0f9d58, #12803f)
    }

    .stat svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .stat b {
      display: block;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1
    }

    .stat span {
      font-size: 13px;
      color: var(--mut);
      font-weight: 600
    }

    .split {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      align-items: start
    }

    .sticky {
      position: sticky;
      top: 92px
    }

    .search {
      position: relative;
      margin: 14px 0 8px
    }

    .search svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 19px;
      height: 19px;
      fill: none;
      stroke: var(--sea);
      stroke-width: 2.2;
      stroke-linecap: round
    }

    .search input {
      padding: 15px 16px 15px 46px;
      font-size: 16px;
      border-radius: 999px;
      background: var(--sf2)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 8px;
      margin: 0 -8px;
      border-radius: 14px;
      border-top: 1px solid var(--line);
      transition: background .15s
    }

    .row:hover {
      background: var(--sf2)
    }

    .av {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      flex: none;
      background: var(--g1)
    }

    .who {
      flex: 1;
      min-width: 0
    }

    .who .mut {
      margin: 2px 0 0;
      overflow-wrap: anywhere
    }

    .chip {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: 1px;
      background: #e3f1f5;
      color: #035a70
    }

    .chip.in {
      background: var(--okbg);
      color: var(--ok)
    }

    .t-Obra {
      background: #fbefd5 !important;
      color: #8a6420 !important
    }

    .av.t-Obra {
      background: linear-gradient(135deg, #b8893a, #e0b968) !important;
      color: #fff !important
    }

    .t-Invitado {
      background: #e8e6fb !important;
      color: #4b44b3 !important
    }

    .av.t-Invitado {
      background: linear-gradient(135deg, #5b52d6, #8f88f0) !important;
      color: #fff !important
    }

    .t-Materiales,
    .t-Cotización {
      background: #fde6ec !important;
      color: #b02a50 !important
    }

    .av.t-Materiales,
    .av.t-Cotización {
      background: linear-gradient(135deg, #c93a63, #ef7b9a) !important;
      color: #fff !important
    }

    .empty {
      border: 2px dashed var(--line);
      border-radius: 22px;
      padding: 44px 26px;
      text-align: center;
      color: var(--mut);
      background: var(--sf)
    }

    .empty svg {
      width: 56px;
      height: 56px;
      fill: none;
      stroke: var(--sea);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 10px
    }

    .empty p {
      margin: 0
    }

    .res {
      border-radius: 22px;
      padding: 30px;
      color: #fff;
      box-shadow: 0 24px 50px -22px rgba(0, 0, 0, .55);
      position: relative;
      overflow: hidden
    }

    .res::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12)
    }

    .res.ok {
      background: linear-gradient(135deg, #0b6b35, #17a45a)
    }

    .res.no {
      background: linear-gradient(135deg, #8f2020, #d24545)
    }

    .res .ic {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, .2);
      border: 2px solid rgba(255, 255, 255, .5)
    }

    .res .ic svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .big {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.1
    }

    .res p {
      margin: 8px 0 18px;
      font-size: 16px;
      opacity: .95;
      position: relative
    }

    .res label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      margin: 0 0 16px;
      position: relative
    }

    .res input {
      width: 96px;
      text-align: center;
      font-weight: 800;
      font-size: 20px;
      border: 0
    }

    .acts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative
    }

    .res button {
      background: #fff;
      color: #0d2a33;
      box-shadow: 0 10px 20px -10px rgba(0, 0, 0, .5)
    }

    .res button.ghost {
      background: transparent;
      color: #fff;
      border-color: rgba(255, 255, 255, .6);
      box-shadow: none
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 18px 0 22px
    }

    .grid label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      font-weight: 700
    }

    .w {
      grid-column: 1/-1
    }

    .ok-msg {
      color: var(--ok);
      font-weight: 700
    }

    .err-msg {
      color: var(--no);
      font-weight: 700
    }

    .scroll {
      overflow-x: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    th,
    td {
      text-align: left;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    th {
      font-weight: 700;
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      background: var(--teal)
    }

    th:first-child {
      border-radius: 12px 0 0 12px
    }

    th:last-child {
      border-radius: 0 12px 12px 0
    }

    td input[type=date] {
      width: auto;
      padding: 9px 12px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: none
    }

    .pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor
    }

    .pill.ok {
      background: var(--okbg);
      color: var(--ok)
    }

    .pill.no {
      background: var(--nobg);
      color: var(--no)
    }

    .paper {
      --sf: #fff;
      --sf2: #f3f8f9;
      --ink: #0d2a33;
      --mut: #5a717b;
      --line: #dbe6ea;
      background: #fff;
      color: #0d2a33;
      max-width: 880px;
      margin: 0 auto 20px;
      padding: clamp(22px, 4vw, 48px);
      border-top: 6px solid var(--gold)
    }

    .paper .logo {
      margin: 0 auto 18px;
      height: 64px
    }

    .paper h2 {
      text-align: center;
      font-size: 22px
    }

    .paper .mut {
      text-align: center
    }

    .paper h3 {
      padding-bottom: 6px;
      border-bottom: 3px solid var(--gold);
      display: inline-block
    }

    .sum {
      background: var(--sf2);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      padding: 14px 18px;
      margin: 8px 0
    }

    .firma {
      margin-top: 38px;
      max-width: 300px;
      border-top: 1.5px solid var(--ink);
      padding-top: 8px
    }

    .firma input {
      border: 0;
      padding: 0;
      background: none;
      font-weight: 700;
      box-shadow: none
    }

    .bar {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .report-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 22px 0 26px;
      border-block: 1px solid #cbd5da
    }

    .report-meta div {
      padding: 10px 14px
    }

    .report-meta div+div {
      border-left: 1px solid #cbd5da
    }

    .report-meta span,
    .report-meta b {
      display: block
    }

    .report-meta span {
      font-size: 11px;
      color: var(--mut);
      text-transform: uppercase
    }

    .report-meta b {
      margin-top: 3px;
      font-size: 13px
    }

    .paper h3 {
      display: block;
      margin: 24px 0 8px;
      padding: 0 0 7px;
      border-bottom: 1px solid #9daeb5;
      color: #183b46;
      font-size: 12px;
      text-transform: uppercase
    }

    .sum {
      border: 1px solid #cbd5da;
      border-left: 4px solid #315b68;
      border-radius: 0;
      background: #f4f6f7;
      padding: 12px 14px
    }

    .firma {
      margin: 48px 0 0 auto;
      width: min(280px, 100%);
      border: 0;
      padding: 0;
      text-align: center
    }

    .firma-line {
      height: 36px;
      border-bottom: 1px solid #263d45
    }

    .firma input {
      width: 100%;
      padding: 7px 0 0;
      text-align: center;
      font-size: 13px
    }

    .firma small {
      display: block;
      color: var(--mut);
      font-size: 11px
    }

    @page {
      size: A4 portrait;
      margin: 15mm 14mm
    }

    @media print {
      body {
        background: #fff;
        color: #111;
        font: 10pt/1.4 Georgia, "Times New Roman", serif
      }

      .top,
      #nav,
      .noprint,
      .hero,
      .bar,
      button {
        display: none !important
      }

      .wrap {
        max-width: none;
        padding: 0
      }

      .content {
        margin: 0;
        padding: 0
      }

      .paper {
        max-width: none;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none
      }

      .paper .logo {
        height: 48px;
        margin: 0 auto 12px
      }

      .paper h2 {
        font: bold 16pt/1.2 Georgia, "Times New Roman", serif;
        text-align: center
      }

      .paper .mut {
        font-size: 9pt
      }

      .paper h3 {
        break-after: avoid-page;
        page-break-after: avoid;
        font-size: 10pt
      }

      .paper .scroll {
        overflow: visible
      }

      .paper table {
        width: 100%;
        table-layout: fixed;
        font-size: 8.5pt
      }

      .paper thead {
        display: table-header-group
      }

      .paper tr {
        break-inside: avoid;
        page-break-inside: avoid
      }

      .paper th,
      .paper td {
        padding: 6px 7px;
        border: 1px solid #9eaaaf;
        overflow-wrap: anywhere
      }

      .paper th {
        background: #e9eef0 !important;
        color: #172b32 !important;
        font-size: 8pt;
        white-space: normal
      }

      .paper textarea {
        min-height: 24mm;
        border: 1px solid #9eaaaf;
        border-radius: 0;
        padding: 8px;
        font: inherit;
        resize: none
      }

      .sum {
        break-inside: avoid;
        background: #f4f6f7 !important
      }

      .firma {
        break-inside: avoid;
        margin-top: 38px
      }
    }

    @media(max-width:860px) {
      .top .wrap {
        height: 62px;
        gap: 12px;
        justify-content: space-between
      }

      .logo {
        height: 38px
      }

      .clock span {
        display: none
      }

      .clock input {
        padding: 7px 12px;
        font-size: 14px
      }

      #nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        box-shadow: 0 -10px 30px -10px rgba(3, 60, 75, .3);
        justify-content: space-around;
        flex: none
      }

      .nav {
        flex-direction: column;
        gap: 3px;
        padding: 8px 4px;
        font-size: 11px;
        flex: 1;
        border-radius: 14px
      }

      .hero {
        padding: 30px 0 112px
      }

      .hero p {
        font-size: 15px
      }

      .sun {
        width: 200px;
        height: 200px;
        right: -30px;
        top: -50px
      }

      .content {
        padding-bottom: 100px
      }

      .split {
        grid-template-columns: 1fr
      }

      .sticky {
        position: static
      }
    }

    @media(max-width:620px) {
      .stats {
        grid-template-columns: 1fr;
        gap: 10px
      }

      .stat {
        padding: 14px 18px
      }

      .stat b {
        font-size: 28px
      }

      .stat i {
        width: 46px;
        height: 46px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .card {
        padding: 20px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    .lg {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(90% 90% at 85% 0, #0b8fa9 0, transparent 55%), linear-gradient(135deg, #021f29, #033c4b 55%, #035a70)
    }

    .lg[hidden] {
      display: none
    }

    .lg form {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 32px;
      background: #fff;
      color: #0d2a33;
      --ink: #0d2a33;
      --mut: #5a717b;
      --line: #dbe6ea;
      --sf: #fff
    }

    .lg .logo {
      height: 56px;
      margin: 0 auto 4px
    }

    .lg h2 {
      text-align: center
    }

    .lg .mut {
      text-align: center;
      margin: 0
    }

    .lg label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 700
    }

    .lg .err-msg {
      margin: 0;
      min-height: 1.2em
    }

    .me {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: right;
      font-size: 14px;
      line-height: 1.25
    }

    .me span {
      display: block;
      color: #5a717b;
      font-size: 12px
    }

    .me b {
      color: #0d2a33
    }

    @media(max-width:620px) {
      .me div {
        display: none
      }
    }
  </style>
</head>

  </header>
  <section class="hero">
    <div class="sun"></div>
    <div class="wrap"><span class="date" id="dt"></span>
      <h1 id="ttl"></h1>
      <p id="sub"></p>
    </div>
    <svg class="waves" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="rgba(255,255,255,.1)" d="M0 60C240 100 480 20 720 56s480 52 720 4V120H0z" />
      <path fill="rgba(255,255,255,.18)" d="M0 84C260 40 500 110 760 80s440-50 680-6V120H0z" />
      <path fill="var(--bg)" d="M0 106C300 72 560 120 820 100s420-40 620-8V120H0z" />
    </svg>
  </section>
  <div class="wrap content">
    <main id="app"></main>
  </div>
  <script src="./config.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    const today = new Date().toLocaleDateString('sv-SE');
    const longDate = new Date().toLocaleDateString('es-PE', { day: 'numeric', month: 'long', year: 'numeric' });
    const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv-SE') };
    const nowHM = () => new Date().toTimeString().slice(0, 5);
    const CUTOFF = '10:00', WORK = ['Obra', 'Mantenimiento'], TYPES = ['Invitado', 'Obra', 'Mantenimiento', 'Materiales', 'Cotización'];
    const TABS = [['porteria', 'Portería'], ['registro', 'Registrar'], ['unidades', 'Unidades'], ['informe', 'Informe']];
    const TITLES = { porteria: ['Portería', 'Verifica y registra el ingreso de cada visita de hoy.'], registro: ['Registrar visita', 'Da de alta invitados, obras, mantenimiento, materiales y cotizaciones.'], unidades: ['Estado de unidades', 'Controla qué propiedades pueden recibir visitas.'], informe: ['Informe de las ' + CUTOFF, 'Resumen diario de obras y mantenimiento, listo para imprimir.'] };
    const ICON = { porteria: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>', registro: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3.2-6 6.5-6s6 2 6.5 6M18 8v6M15 11h6"/>', unidades: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', informe: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>' };

    /* ---- Sesión y API ---- */
    let ME = null, UI = { tab: 'porteria', q: '' }, D = { p: [], u: [], r: null };
    const ROLES = { admin: 'Administración', porteria: 'Portería', propietario: 'Propietario', cctv: 'Operador CCTV' };
    const NAV = { admin: ['porteria', 'registro', 'unidades', 'informe'], porteria: ['porteria'], propietario: ['registro', 'porteria'], cctv: ['informe'] };
    const gate = () => ME.role === 'admin' || ME.role === 'porteria';
    const API_BASE = String(window.PLH_API_BASE || '').replace(/\/+$/, '');
    async function api(p, o = {}) {
      const r = await fetch(`${API_BASE}/api${p}`, { method: o.method || 'GET', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: o.body ? JSON.stringify(o.body) : undefined });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401 && p !== '/auth/login') { showLogin(); throw null }
      if (!r.ok) throw new Error(j.error || 'No se pudo completar la acción.');
      return j;
    }
    const fail = e => { if (e) alert(e.message) };
    async function boot() { try { ME = (await api('/auth/me')).user; start() } catch (e) { showLogin() } }
    function start() { $('#login').hidden = true; $('#mn').textContent = ME.name; $('#mr').textContent = ROLES[ME.role]; UI.tab = NAV[ME.role][0]; render() }
    function showLogin() { ME = null; $('#login').hidden = false; $('#app').innerHTML = '' }
    async function login(e) {
      e.preventDefault(); $('#le').textContent = '';
      try { ME = (await api('/auth/login', { method: 'POST', body: { email: $('#em').value, password: $('#pw').value } })).user; $('#pw').value = ''; start() } catch (x) { $('#le').textContent = x ? x.message : '' }
    }
    async function logout() { await api('/auth/logout', { method: 'POST' }).catch(() => { }); showLogin() }

    /* ---- Vistas ---- */
    const ini = s => String(s).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    const SVG = (d, c = '') => `<svg viewBox="0 0 24 24" class="${c}" aria-hidden="true">${d}</svg>`;
    const OK = '<path d="M5 12.5l4.5 4.5L19 7.5"/>', NO = '<path d="M6 6l12 12M18 6L6 18"/>';
    function vPorteria() {
      const own = ME.role === 'propietario';
      return `<div id="stats" class="stats"></div>
  <div class="${gate() ? 'split' : ''}"><section class="card"><h2>${own ? 'Visitas de tu propiedad' : 'Visitas de hoy'}</h2>
  <p class="mut">${own ? 'Aquí ves el estado de las visitas que registraste.' : `El informe diario se corta a las ${CUTOFF}.`}</p>
  <div class="search">${SVG('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>')}<input id="q" type="search" aria-label="Buscar visita" placeholder="Nombre, DNI, placa o lote" value="${esc(UI.q)}" oninput="UI.q=this.value;draw()"></div><div id="list"></div></section>
  ${gate() ? `<div id="res" class="sticky"><div class="empty">${SVG('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>')}<p>Elige una visita y pulsa <b>Verificar</b> para ver si puede ingresar.</p></div></div>` : ''}</div>`;
    }
    async function load() { try { D.p = (await api('/passes')).passes; draw() } catch (e) { if (e && $('#list')) $('#list').innerHTML = `<p class="err-msg">${esc(e.message)}</p>` } }
    function draw() {
      if (!$('#list')) return;
      const ps = D.p, q = UI.q.toLowerCase(), dentro = ps.reduce((a, p) => a + Math.max(0, p.inside), 0), act = ps.filter(p => p.inside > 0).length;
      const st = (i, n, l) => `<div class="stat"><i>${SVG(i)}</i><div><b>${n}</b><span>${l}</span></div></div>`;
      $('#stats').innerHTML = st('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', ps.length, 'Visitas de hoy') + st('<path d="M5 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18M13 12v.5"/>', act, 'Pases con gente dentro') + st('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3.2-6 6.5-6s6 2 6.5 6M16 5a3.5 3.5 0 0 1 0 6.5M18 14.5c2 .7 3 2.8 3.5 5.5"/>', dentro, 'Personas dentro');
      const rows = ps.filter(p => !q || [p.name, p.doc, p.lot].join(' ').toLowerCase().includes(q));
      $('#list').innerHTML = rows.map(p => `<div class="row"><div class="av t-${p.type}">${esc(ini(p.name))}</div><div class="who"><b>${esc(p.name)}</b><span class="chip t-${p.type}">${p.type}</span>${p.inside > 0 ? `<span class="chip in">Dentro: ${p.inside}</span>` : ''}<div class="mut">${esc(p.lot)}${p.work ? ' · ' + esc(p.work) : ''}${p.doc ? ' · ' + esc(p.doc) : ''}</div></div>${gate() ? `<button class="sm" onclick="check('${p.id}')">Verificar</button>` : ''}</div>`).join('')
        || '<p class="mut">No hay visitas de hoy con ese criterio.</p>';
    }
    async function check(id) {
      const p = D.p.find(x => x.id === id); let r;
      try { r = await api(`/passes/${id}/verify`, { method: 'POST' }) } catch (e) { if (!e) return; r = { ok: false, msg: e.message } }
      $('#res').innerHTML = `<div class="res ${r.ok ? 'ok' : 'no'}"><div class="ic">${SVG(r.ok ? OK : NO)}</div><div class="big">${r.ok ? 'Autorizado' : 'No autorizado'}</div>
  <p>${esc(r.ok ? p.name + ' · ' + p.lot : r.msg)}</p>
  ${r.ok ? `<label>Personas que ingresan <input type="number" id="n" min="1" value="1"></label><div class="acts"><button onclick="mark('${id}','in')">Registrar entrada</button>` : '<div class="acts">'}
  ${p.inside > 0 ? `<button class="ghost" onclick="mark('${id}','out')">Registrar salida</button>` : ''}</div></div>`;
      $('#res').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    async function mark(id, kind) {
      const n = kind === 'in' ? Math.max(1, +($('#n').value || 1)) : 0;
      try {
        const r = await api(`/passes/${id}/log`, { method: 'POST', body: { kind, people: n } }); await load();
        $('#res').innerHTML = `<div class="res ok"><div class="ic">${SVG(OK)}</div><div class="big">${kind === 'in' ? 'Entrada registrada' : 'Salida registrada'}</div><p>${r.people} persona(s) registradas.</p></div>`
      }
      catch (e) { if (e) $('#res').innerHTML = `<div class="res no"><div class="ic">${SVG(NO)}</div><div class="big">No se registró</div><p>${esc(e.message)}</p></div>` }
    }
    function vRegistro() {
      const types = ME.role === 'admin' ? TYPES : ['Invitado', 'Cotización', 'Materiales'];
      return `<section class="card" style="max-width:760px"><h2>Datos de la visita</h2><p class="mut">${ME.role === 'admin' ? 'Administración registra club, obras y mantenimiento, y cualquier visita.' : 'Registra invitados, cotizaciones y materiales para tu propiedad.'}</p>
  <div class="grid"><label>Tipo<select id="f_t">${types.map(t => `<option>${t}</option>`).join('')}</select></label>
  <label>Destino<select id="f_u">${D.u.map(u => `<option value="${u.id}">${esc(u.lot)}${u.owner ? ' (' + esc(u.owner) + ')' : ''}</option>`).join('')}</select></label>
  <label>Nombre o contratista<input id="f_n" autocomplete="off"></label><label>DNI o placa<input id="f_d" autocomplete="off"></label>

  <button onclick="addPass()">Guardar visita</button><p id="msg" class="mut" role="status"></p></section>`;
    }
    async function addPass() {
      const m = $('#msg');
      try {
        await api('/passes', { method: 'POST', body: { type: $('#f_t').value, unit_id: $('#f_u').value, name: $('#f_n').value, doc: $('#f_d').value, work: $('#f_w').value } });
        m.className = 'ok-msg'; m.textContent = 'Visita guardada. Ya aparece en Portería.';['#f_n', '#f_d', '#f_w'].forEach(s => $(s).value = '')
      }
      catch (e) { if (e) { m.className = 'err-msg'; m.textContent = e.message } }
    }

  <td><button class="pill ${u.apto ? 'ok' : 'no'}" aria-label="Cambiar estado" onclick="patchU('${u.id}',{apto:${!u.apto}},1)">${u.apto ? 'Apto' : 'No apto'}</button></td>

    }

  <div class="report-meta"><div><span>Fecha del informe</span><b>${longDate}</b></div><div><span>Hora de corte</span><b>${R.cutoff}</b></div><div><span>Emitido</span><b>${new Date().toLocaleString('es-PE', { dateStyle: 'medium', timeStyle: 'short' })}</b></div></div>
  <h3>I. Obras en ejecución</h3>${tbl(R.obra)}<h3>II. Mantenimiento</h3>${tbl(R.mant)}

  ${R.props.map(u => `<tr><td>${u.code ?? '—'}</td><td>${esc(u.owner)}</td><td>${esc(u.lot)}</td><td>${u.partida || '—'}</td></tr>`).join('')}</tbody></table></div>
  <div class="firma"><div class="firma-line"></div><input id="sg" value="${esc(R.signer)}" onchange="saveNotes()" aria-label="Cargo del firmante"><small>Firma y sello</small></div></section>
  <div class="bar"><button onclick="window.print()">Imprimir o guardar PDF</button></div>`;
    }
    function saveNotes() { api('/report/notes', { method: 'PUT', body: { notes: $('#nt').value, signer: $('#sg').value } }).catch(fail) }

    /* ---- Render ---- */
    function go(k) { UI.tab = k; render(); window.scrollTo(0, 0) }
    async function render() {
      if (!ME) return;
      $('#nav').innerHTML = TABS.filter(([k]) => NAV[ME.role].includes(k)).map(([k, l]) => `<button class="nav${UI.tab === k ? ' on' : ''}"${UI.tab === k ? ' aria-current="page"' : ''} onclick="go('${k}')">${SVG(ICON[k])}<span>${k === 'porteria' && ME.role === 'propietario' ? 'Mis visitas' : l}</span></button>`).join('');
      const T = ME.role === 'propietario' && UI.tab === 'porteria' ? ['Mis visitas', 'Estado de las visitas de tu propiedad hoy.'] : TITLES[UI.tab];
      $('#ttl').textContent = T[0]; $('#sub').textContent = T[1];
      const d = new Date().toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' }); $('#dt').textContent = d[0].toUpperCase() + d.slice(1);
      const tab = UI.tab;
      try { if (tab === 'registro' || tab === 'unidades') D.u = (await api('/units')).units; if (tab === 'informe') D.r = await api('/report') }
      catch (e) { if (e) $('#app').innerHTML = `<p class="err-msg">${esc(e.message)}</p>`; return }
      if (tab !== UI.tab) return;
      $('#app').innerHTML = { porteria: vPorteria, registro: vRegistro, unidades: vUnidades, informe: vInforme }[tab]();
      if (tab === 'porteria') load();
    }
    setInterval(() => { if (ME && UI.tab === 'porteria' && !document.hidden) load() }, 20000);
    boot();
  </script>
